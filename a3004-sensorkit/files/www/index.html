<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>A3004NS-M Sensor Bridge</title>
<style>
:root {
	--bg: #0b0e13;
	--panel: #141922;
	--edge: #232b38;
	--fg: #e6ecf5;
	--dim: #8695ab;
	--ok: #34d399;
	--warn: #fbbf24;
	--bad: #f87171;
	--accent: #60a5fa;
}
* { box-sizing: border-box; }
html { height: 100%; }
body {
	height: 100dvh;
	min-height: 100%;
	margin: 0;
	overflow: hidden;
	background: var(--bg);
	color: var(--fg);
	font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Noto Sans KR", sans-serif;
	-webkit-text-size-adjust: 100%;
	display: flex;
	flex-direction: column;
}
header {
	display: flex;
	align-items: center;
	gap: 10px;
	padding: 10px 16px;
	border-bottom: 1px solid var(--edge);
	background: var(--panel);
	flex: none;
	flex-wrap: wrap;
}
header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .2px; }
header .sp { flex: 1; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.dot.off { background: var(--bad); }
.pill {
	font-size: 12px;
	color: var(--dim);
	border: 1px solid var(--edge);
	border-radius: 999px;
	padding: 3px 10px;
	white-space: nowrap;
}
.pill.alarm { color: #fff; background: var(--bad); border-color: var(--bad); }
.pill.live { color: var(--ok); border-color: #235240; }

main {
	flex: 1;
	display: grid;
	gap: 10px;
	padding: 10px;
	grid-template-columns: 1fr 1fr;
	grid-template-rows: minmax(0, 1fr) auto;
	min-height: 0;
}
@media (max-width: 1000px) { main { grid-template-columns: 1fr; } }

.card {
	background: var(--panel);
	border: 1px solid var(--edge);
	border-radius: 12px;
	display: flex;
	flex-direction: column;
	overflow: hidden;
	min-height: 0;
}
.card > h2 {
	font-size: 12px;
	text-transform: uppercase;
	letter-spacing: .08em;
	color: var(--dim);
	margin: 0;
	padding: 9px 14px;
	border-bottom: 1px solid var(--edge);
	display: flex;
	align-items: center;
	gap: 8px;
}
.card > h2 .sp { flex: 1; }
.body { flex: 1; position: relative; min-height: 0; display: flex; }

#cam {
	width: 100%; height: 100%;
	object-fit: contain;
	background: #000;
	display: block;
	/* until a frame decodes, an <img> with a dead src shows a broken-image
	   glyph; hide it rather than let that be the first thing on screen */
	visibility: hidden;
}
#cam.live { visibility: visible; }
#camMsg {
	position: absolute; inset: 0;
	display: flex; align-items: center; justify-content: center;
	padding: 20px;
	color: var(--dim); font-size: 13px;
}
/* the flex parent only centres; the text itself must be a block, or each
   inline child becomes its own flex item and the message comes apart */
#camMsg > div { text-align: center; max-width: 34em; line-height: 1.7; }
#camMsg code {
	font-size: 12px; color: var(--fg);
	background: #1d2534; border-radius: 4px; padding: 1px 5px;
	white-space: nowrap;
}
#lidar { width: 100%; height: 100%; display: block; touch-action: none; }

.stats {
	flex: none;
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
	gap: 1px;
	background: var(--edge);
	border-top: 1px solid var(--edge);
}
.stat { background: var(--panel); padding: 7px 10px; min-width: 0; }
.stat .k { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); }
.stat .v { font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .v.warn { color: var(--warn); }
.stat .v.bad { color: var(--bad); }

.ctl {
	flex: none;
	display: flex; align-items: center; gap: 10px;
	padding: 7px 14px;
	border-top: 1px solid var(--edge);
	font-size: 12px; color: var(--dim);
	flex-wrap: wrap;
}
.ctl input[type=range] { flex: 1; min-width: 90px; accent-color: var(--accent); }
button {
	font: inherit; font-size: 12px;
	color: var(--fg); background: #1d2534;
	border: 1px solid var(--edge); border-radius: 7px;
	padding: 5px 11px; cursor: pointer;
}
button:active { background: #263047; }
button.on { color: #0b0e13; background: var(--ok); border-color: var(--ok); }

#vu {
	flex: none; width: 88px; height: 8px;
	background: #1d2534; border-radius: 4px; overflow: hidden;
}
#vuFill { height: 100%; width: 0%; background: var(--ok); transition: width .06s linear; }

#canWrap { grid-column: 1 / -1; max-height: 34vh; }
#canWrap.hidden, #rcWrap.hidden { display: none; }

#rcWrap { grid-column: 1 / -1; }
#rcBars {
	flex: 1; overflow: auto; min-height: 0;
	padding: 8px 14px 12px;
	display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
	gap: 4px 16px;
}
.rcRow { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.rcRow .n { color: var(--dim); width: 2.2em; flex: none;
	font: 11px/1 ui-monospace, monospace; }
.rcRow .bar {
	flex: 1; height: 8px; background: #1d2534; border-radius: 4px;
	position: relative; overflow: hidden;
}
/* centre tick: RC sticks rest at 1500, so the midpoint is the reference */
.rcRow .bar::after {
	content: ""; position: absolute; left: 50%; top: 0; bottom: 0;
	width: 1px; background: #3d4859;
}
.rcRow .fill { display: block; height: 100%; background: var(--accent); }
.rcRow .v { width: 3.4em; text-align: right; flex: none;
	font: 12px/1 ui-monospace, monospace; font-variant-numeric: tabular-nums; }
#rcWrap.lost .rcRow .fill { background: var(--dim); }
#canTable {
	flex: 1; overflow: auto; min-height: 0;
	font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
	padding: 4px 14px 10px;
}
#canTable table { border-collapse: collapse; width: 100%; }
#canTable th {
	text-align: left; color: var(--dim); font-weight: 500;
	font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
	padding: 4px 10px 4px 0; position: sticky; top: 0; background: var(--panel);
}
#canTable td { padding: 2px 10px 2px 0; white-space: nowrap; }
#canTable td.stale, #canTable tr.stale td { color: var(--dim); }
#canTable .hint { color: var(--dim); padding: 8px 0; font-family: inherit; }
</style>
</head>
<body>

<header>
	<span class="dot" id="linkDot"></span>
	<h1>A3004NS-M Sensor Bridge</h1>
	<span class="sp"></span>
	<span class="pill" id="feedPill">feed: —</span>
	<span class="pill" id="profilePill">lidar: —</span>
	<span class="pill" id="alarmPill">zones: —</span>
</header>

<main>
	<section class="card">
		<h2>USB camera<span class="sp"></span><span id="camLabel">—</span></h2>
		<div class="body">
			<img id="cam" alt="">
			<div id="camMsg"><div id="camMsgText">스트림 연결 중…</div></div>
		</div>
		<div class="ctl">
			<button id="camReload">스트림 재연결</button>
			<button id="micBtn">🎤 마이크 켜기</button>
			<div id="vu"><div id="vuFill"></div></div>
			<span id="micHint"></span>
		</div>
	</section>

	<section class="card">
		<h2>Lidar range ring<span class="sp"></span><span id="ringLabel">—</span></h2>
		<div class="body"><canvas id="lidar"></canvas></div>
		<div class="ctl">
			<label for="zoom">범위</label>
			<input type="range" id="zoom" min="2" max="100" step="1" value="30">
			<span id="zoomLabel">30 m</span>
		</div>
		<div class="stats">
			<div class="stat"><div class="k">frames/s</div><div class="v" id="sFps">—</div></div>
			<div class="stat"><div class="k">packets/s</div><div class="v" id="sPps">—</div></div>
			<div class="stat"><div class="k">Mbit/s</div><div class="v" id="sMbps">—</div></div>
			<div class="stat"><div class="k">missed cols</div><div class="v" id="sMiss">—</div></div>
			<div class="stat"><div class="k">nearest</div><div class="v" id="sNear">—</div></div>
			<div class="stat"><div class="k">relayed</div><div class="v" id="sRelay">—</div></div>
		</div>
	</section>

	<section class="card hidden" id="rcWrap">
		<h2>RC (i-BUS)<span class="sp"></span><span id="rcLabel">—</span></h2>
		<div id="rcBars"></div>
	</section>

	<section class="card hidden" id="canWrap">
		<h2>CAN<span class="sp"></span><span id="canLabel">—</span></h2>
		<div id="canTable"></div>
	</section>
</main>

<script>
"use strict";

var POLL_MS = 250;
var SSE_PORT = 7603;
var CAM_PORT = 8080;
var MIC_PORT = 8082;

var el = function (id) { return document.getElementById(id); };
var cv = el("lidar"), g2 = cv.getContext("2d");
var maxRange = 30;
var state = null;
var prev = null, prevT = 0;
var lastGood = 0;
var base = location.protocol + "//" + (location.hostname || "127.0.0.1");

/* ---------- camera ---------- */

function camUrl() {
	/* ustreamer listens on :8080 on the router itself, so derive the host
	   from wherever this page was loaded. Cache-bust on reconnect. */
	return base + ":" + CAM_PORT + "/stream?_=" + Date.now();
}

function camConnect() {
	el("camMsg").style.display = "flex";
	el("camMsgText").textContent = "스트림 연결 중…";
	el("cam").src = camUrl();
}

el("cam").addEventListener("load", function () {
	this.classList.add("live");
	el("camMsg").style.display = "none";
	el("camLabel").textContent = this.naturalWidth + "x" + this.naturalHeight;
});

el("cam").addEventListener("error", function () {
	this.classList.remove("live");
	el("camMsg").style.display = "flex";
	el("camMsgText").innerHTML =
		"카메라 스트림이 없습니다.<br><br>" +
		"<code>sensor-probe</code> 로 카메라가 MJPEG 를 내는지 확인하고<br>" +
		"<code>/etc/init.d/ustreamer start</code> 를 실행하세요.";
	el("camLabel").textContent = "off";
});

el("camReload").addEventListener("click", camConnect);

/* ---------- microphone ----------
   Raw PCM through Web Audio rather than an <audio> element: media elements
   buffer heavily, which is the opposite of what an uncompressed stream is for.
   Playback must begin from a user gesture, or autoplay policy blocks it and
   the failure is silent. */

var audio = { ac: null, on: false, at: 0, ctl: null, rate: 16000, ch: 1 };
var LEAD = 0.08;	/* jitter headroom; the floor is one 10 ms ALSA period */

function micStop() {
	audio.on = false;
	if (audio.ctl) { audio.ctl.abort(); audio.ctl = null; }
	if (audio.ac) { audio.ac.close(); audio.ac = null; }
	el("micBtn").classList.remove("on");
	el("micBtn").textContent = "🎤 마이크 켜기";
	el("vuFill").style.width = "0%";
}

function micStart() {
	audio.ctl = new AbortController();
	el("micHint").textContent = "연결 중…";
	fetch(base + ":" + MIC_PORT + "/info", { signal: audio.ctl.signal })
		.then(function (r) { return r.json(); })
		.then(function (info) {
			audio.rate = info.rate || 16000;
			audio.ch = info.channels || 1;
			audio.ac = new (window.AudioContext || window.webkitAudioContext)();
			audio.on = true;
			audio.at = 0;
			el("micBtn").classList.add("on");
			el("micBtn").textContent = "🎤 마이크 끄기";
			el("micHint").textContent = (audio.rate / 1000) + " kHz · " +
				(audio.ch === 1 ? "mono" : "stereo") + " · PCM";
			return fetch(base + ":" + MIC_PORT + "/pcm",
				     { signal: audio.ctl.signal });
		})
		.then(function (r) {
			if (!r.ok || !r.body) throw new Error("no stream");
			return pump(r.body.getReader());
		})
		.catch(function (e) {
			if (e.name === "AbortError") return;
			el("micHint").textContent = "마이크 없음 (mic-stream 미실행?)";
			micStop();
		});
}

function pump(reader) {
	var tail = new Uint8Array(0);

	function step() {
		return reader.read().then(function (res) {
			if (res.done || !audio.on) return;
			var buf = new Uint8Array(tail.length + res.value.length);
			buf.set(tail, 0);
			buf.set(res.value, tail.length);

			/* a sample frame must not be split across chunks */
			var fb = 2 * audio.ch;
			var usable = Math.floor(buf.length / fb) * fb;
			tail = buf.slice(usable);
			if (usable) play(buf.subarray(0, usable));
			return step();
		});
	}
	return step();
}

function play(bytes) {
	var ac = audio.ac;
	if (!ac) return;

	var dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
	var n = bytes.byteLength / 2 / audio.ch;
	var ab = ac.createBuffer(audio.ch, n, audio.rate);
	var peak = 0, i, c, v, out;

	for (c = 0; c < audio.ch; c++) {
		out = ab.getChannelData(c);
		for (i = 0; i < n; i++) {
			v = dv.getInt16((i * audio.ch + c) * 2, true) / 32768;
			out[i] = v;
			if (c === 0) {
				v = v < 0 ? -v : v;
				if (v > peak) peak = v;
			}
		}
	}

	var src = ac.createBufferSource();
	src.buffer = ab;
	src.connect(ac.destination);

	/* Schedule back-to-back. If we have fallen behind, resync instead of
	   accumulating an ever-growing delay. */
	var now = ac.currentTime;
	if (audio.at < now + 0.005) audio.at = now + LEAD;
	src.start(audio.at);
	audio.at += ab.duration;

	el("vuFill").style.width = Math.min(100, peak * 140).toFixed(0) + "%";
	el("vuFill").style.background = peak > 0.85 ? "var(--bad)" :
		peak > 0.5 ? "var(--warn)" : "var(--ok)";
}

el("micBtn").addEventListener("click", function () {
	if (audio.on) micStop(); else micStart();
});

/* ---------- lidar ring ---------- */

el("zoom").addEventListener("input", function () {
	maxRange = +this.value;
	el("zoomLabel").textContent = maxRange + " m";
	draw();
});

function resize() {
	var r = cv.getBoundingClientRect();
	var dpr = window.devicePixelRatio || 1;
	cv.width = Math.max(1, Math.round(r.width * dpr));
	cv.height = Math.max(1, Math.round(r.height * dpr));
	draw();
}
window.addEventListener("resize", resize);
if (window.ResizeObserver) {
	/* The CAN card appears at runtime and re-flows the grid. That changes the
	   canvas box without firing a window resize, which left the backing store
	   stale and drew the range circles as ellipses. */
	new ResizeObserver(resize).observe(cv);
}

function rangeColor(m) {
	/* near = red, far = blue, so an approaching object is obvious */
	return "hsl(" + (8 + Math.min(1, m / maxRange) * 210) + ", 85%, 58%)";
}

function draw() {
	var w = cv.width, h = cv.height;
	var cx = w / 2, cy = h / 2;
	var R = Math.min(w, h) * 0.46;
	var dpr = window.devicePixelRatio || 1;
	var i, n, ring, a, r, px, py, m, step, dotR;

	g2.clearRect(0, 0, w, h);
	g2.fillStyle = "#0b0e13";
	g2.fillRect(0, 0, w, h);

	step = maxRange <= 10 ? 2 : maxRange <= 30 ? 5 : maxRange <= 60 ? 10 : 20;
	g2.font = (11 * dpr) + "px ui-sans-serif, sans-serif";
	g2.textAlign = "left";
	for (m = step; m <= maxRange; m += step) {
		g2.beginPath();
		g2.arc(cx, cy, R * m / maxRange, 0, Math.PI * 2);
		g2.strokeStyle = "#1d2534";
		g2.lineWidth = 1;
		g2.stroke();
		g2.fillStyle = "#3d4859";
		g2.fillText(m + "m", cx + 4, cy - R * m / maxRange - 3);
	}

	g2.strokeStyle = "#1d2534";
	g2.beginPath();
	g2.moveTo(cx - R, cy); g2.lineTo(cx + R, cy);
	g2.moveTo(cx, cy - R); g2.lineTo(cx, cy + R);
	g2.stroke();

	if (!state || !state.ring_cm) {
		g2.fillStyle = "#8695ab";
		g2.textAlign = "center";
		g2.fillText("lidar 데이터 없음", cx, cy + R + 22);
		return;
	}

	ring = state.ring_cm;
	n = ring.length;
	dotR = Math.max(1.5 * dpr, R * 2 * Math.PI / n * 0.42);

	for (i = 0; i < n; i++) {
		if (ring[i] < 0) continue;
		m = ring[i] / 100;
		if (m > maxRange) continue;
		/* sector 0 points up, azimuth increases clockwise */
		a = (i / n) * Math.PI * 2 - Math.PI / 2;
		r = R * m / maxRange;
		px = cx + Math.cos(a) * r;
		py = cy + Math.sin(a) * r;
		g2.beginPath();
		g2.arc(px, py, dotR, 0, Math.PI * 2);
		g2.fillStyle = rangeColor(m);
		g2.fill();
	}

	g2.beginPath();
	g2.arc(cx, cy, 3 * dpr, 0, Math.PI * 2);
	g2.fillStyle = "#e6ecf5";
	g2.fill();
}

function setStat(id, val, cls) {
	var e = el(id);
	e.textContent = val;
	e.className = "v" + (cls ? " " + cls : "");
}

function onStatus(s) {
	var now = Date.now(), dt, near = Infinity, i;

	lastGood = now;
	el("linkDot").className = "dot on";

	if (prev && prevT) {
		dt = (now - prevT) / 1000;
		if (dt > 0.05) {
			setStat("sFps", ((s.frames - prev.frames) / dt).toFixed(1));
			setStat("sPps", Math.round((s.packets - prev.packets) / dt));
			setStat("sMbps", (((s.bytes - prev.bytes) * 8 / dt) / 1e6).toFixed(1));
			setStat("sRelay", s.relayed > 0 ?
				Math.round((s.relayed - prev.relayed) / dt) + "/s" : "off");
		}
	}
	prev = s; prevT = now;
	state = s;

	setStat("sMiss", s.missed_columns,
		s.missed_columns > 0 ? (s.missed_columns > 1000 ? "bad" : "warn") : "");

	if (s.ring_cm) {
		for (i = 0; i < s.ring_cm.length; i++)
			if (s.ring_cm[i] >= 0 && s.ring_cm[i] < near) near = s.ring_cm[i];
	}
	setStat("sNear", near === Infinity ? "—" : (near / 100).toFixed(2) + " m",
		near / 100 < 2 ? "warn" : "");

	el("profilePill").textContent = "lidar: " + s.channels + "ch · " + s.profile;

	var ap = el("alarmPill");
	if (s.zone_alarm) {
		ap.textContent = "ZONE INTRUSION";
		ap.className = "pill alarm";
	} else {
		ap.textContent = "zones: clear";
		ap.className = "pill";
	}

	el("ringLabel").textContent = s.sectors + " sectors · frame " + s.frame_id;
	draw();
}

function goStale() {
	if (Date.now() - lastGood > 3000) {
		el("linkDot").className = "dot off";
		el("profilePill").textContent = "lidar: 없음";
		state = null;
		draw();
	}
}

/* Push first, poll only as a fallback. ouster-edge emits one SSE event per
   revolution, so the ring arrives when it exists rather than up to a poll
   interval later - measured at well under a millisecond versus 200 ms+. */
var sse = null, polling = null;

function startPolling() {
	if (polling) return;
	el("feedPill").textContent = "feed: polling";
	el("feedPill").className = "pill";
	polling = setInterval(function () {
		fetch("ouster.json", { cache: "no-store" })
			.then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
			.then(onStatus)
			.catch(goStale);
	}, POLL_MS);
}

function startSSE() {
	try {
		sse = new EventSource(base + ":" + SSE_PORT + "/");
	} catch (e) {
		startPolling();
		return;
	}
	sse.onopen = function () {
		el("feedPill").textContent = "feed: push";
		el("feedPill").className = "pill live";
		if (polling) { clearInterval(polling); polling = null; }
	};
	sse.onmessage = function (ev) {
		try { onStatus(JSON.parse(ev.data)); } catch (e) { /* ignore */ }
	};
	sse.onerror = function () {
		/* EventSource retries by itself; poll meanwhile so the page still
		   shows something when SSE is blocked or the daemon is down. */
		goStale();
		startPolling();
	};
	setTimeout(function () { if (!lastGood) startPolling(); }, 1500);
}

/* ---------- CAN telemetry ---------- */

function canPoll() {
	fetch("can.json", { cache: "no-store" })
		.then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
		.then(function (c) {
			var ids = Object.keys(c.frames || {}).sort();
			var html, f, stale;

			el("canWrap").classList.remove("hidden");
			el("canLabel").textContent = c.interface + " · rx " + c.rx +
				(c.inject_allowed ? " · INJECT ENABLED" : " · read-only");

			if (!ids.length) {
				el("canTable").innerHTML = "<div class=\"hint\">" +
					"추적 중인 ID 없음. <code>option discover 1</code> 로 " +
					"차량이 실제로 보내는 ID 를 먼저 찾으세요.</div>";
				return;
			}

			html = "<table><thead><tr><th>ID</th><th>DATA</th>" +
			       "<th>COUNT</th><th>AGE</th></tr></thead><tbody>";
			ids.forEach(function (id) {
				f = c.frames[id];
				stale = f.age_ms > 1000 ? " class=\"stale\"" : "";
				html += "<tr" + stale + "><td>0x" + id + "</td><td>" +
					(f.data.match(/../g) || []).join(" ") +
					"</td><td>" + f.count + "</td><td>" +
					f.age_ms + " ms</td></tr>";
			});
			el("canTable").innerHTML = html + "</tbody></table>";
		})
		.catch(function () { el("canWrap").classList.add("hidden"); });
}

function rcPoll() {
	fetch("rc.json", { cache: "no-store" })
		.then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
		.then(function (rc) {
			var html = "", i, v, pct;

			el("rcWrap").classList.remove("hidden");
			/* A stale status file means the daemon died; treat that the
			   same as a lost link rather than showing frozen sticks. */
			var lost = !rc.link || rc.age_ms > 1000;
			el("rcWrap").classList.toggle("lost", lost);
			el("rcLabel").textContent = (lost ? "LINK LOST" : "link ok") +
				" · " + rc.frames + " frames" +
				(rc.bad_crc ? " · " + rc.bad_crc + " bad crc" : "") +
				(rc.link_losses ? " · " + rc.link_losses + " drops" : "");

			for (i = 0; i < rc.channels.length; i++) {
				v = rc.channels[i];
				/* 1000-2000 us is the usable travel of a hobby RC channel */
				pct = Math.max(0, Math.min(100, (v - 1000) / 10));
				html += "<div class=\"rcRow\"><span class=\"n\">CH" +
					(i + 1) + "</span><span class=\"bar\">" +
					"<span class=\"fill\" style=\"width:" +
					pct.toFixed(1) + "%\"></span></span>" +
					"<span class=\"v\">" + v + "</span></div>";
			}
			el("rcBars").innerHTML = html;
		})
		.catch(function () { el("rcWrap").classList.add("hidden"); });
}

resize();
camConnect();
startSSE();
canPoll();
setInterval(canPoll, 500);
rcPoll();
setInterval(rcPoll, 200);
</script>
</body>
</html>
